apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-service
  template:
    metadata:
      labels:
        app: hello-service
  spec:
    containers:
        - name: hello-service
          image: jasjitrudra77/hello-service:1.0.0_110f4f0_2026-10-05_165428
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /hello
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
