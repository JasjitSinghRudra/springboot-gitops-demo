name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  APP_VERSION: 1.0.0
  DOCKERHUB_USERNAME: jasjitrudra77
  IMAGE_NAME: hello-service

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven
        if: ${{ env.ACT == 'true' }}
        run: |
          apt-get update
          apt-get install -y maven

      - name: Run tests
        run: mvn test

      - name: Build jar
        run: mvn package -DskipTests

      - name: Upload jar artifact
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: hello-service-jar
          path: target/hello-service-1.0.0.jar

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      full_image: ${{ steps.tag.outputs.full_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven
        if: ${{ env.ACT == 'true' }}
        run: |
          apt-get update
          apt-get install -y maven

      - name: Build jar
        run: mvn package -DskipTests

      - name: Compute image tag
        id: tag
        run: |
          SHA="${GITHUB_SHA::7}"
          TS=$(date -u +'%Y-%m-%d_%H%M%S')
          TAG="${{ env.APP_VERSION }}_${SHA}_${TS}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          PUSH_TAG="${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"
          docker build -t "${PUSH_TAG}" .
          docker push "${PUSH_TAG}"
          docker pull "${PUSH_TAG}"

      - name: Smoke test image
        run: |
          PUSH_TAG="${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"
          docker run -d --name hello-test -p 8080:8080 "${PUSH_TAG}"
          sleep 8
          curl --fail http://localhost:8080/hello || (docker logs hello-test && exit 1)
          docker stop hello-test
          docker rm hello-test

  update-manifest:
    name: Update K8s Manifest
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GIT_TOKEN }}

      - name: Update image in deployment.yaml
        run: |
          sed -i "s|image: .*hello-service:.*|image: ${{ needs.docker-build-push.outputs.full_image }}|" k8s/deployment.yaml

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git remote set-url origin "https://x-access-token:${{ secrets.GIT_TOKEN }}@github.com/${{ github.repository }}.git"
          git diff --cached --quiet || git commit -m "ci: update hello-service image to ${{ needs.docker-build-push.outputs.image_tag }}"
          git push origin HEAD:master